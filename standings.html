<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول الترتيب - standings.html</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ترتيب الفرق (Standings)</h1>
        <nav><a href="index.html">← العودة للرئيسية</a></nav>
    </header>

    <div class="container">
        <div class="form-group">
            <label>اختر الدوري (League):</label>
            <select id="league">
                <option value="PL">الدوري الإنجليزي الممتاز (Premier League)</option>
                <option value="PD">الدوري الإسباني (La Liga)</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>الفريق (Name)</th>
                    <th>لعب (P)</th>
                    <th>فوز (W)</th>
                    <th>تعادل (D)</th>
                    <th>خسارة (L)</th>
                    <th>النقاط (Points)</th>
                </tr>
            </thead>
            <tbody id="standings-body">
                <!-- سيتم التحميل عبر الـ Script -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
