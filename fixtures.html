<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المباريات - fixtures.html</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>جدول المباريات (Fixtures)</h1>
        <nav><a href="index.html">← العودة للرئيسية</a></nav>
    </header>

    <div class="container">
        <div class="form-group">
            <label>League:</label>
            <select>
                <option>الدوري الإنجليزي الممتاز</option>
                <option>دوري أبطال أوروبا</option>
            </select>
        </div>
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>Date From:</label>
                <input type="date" value="2026-09-26">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Date To:</label>
                <input type="date" value="2026-09-30">
            </div>
        </div>

        <div style="margin-top: 20px;">
            <div class="card" style="padding: 15px; margin-bottom: 10px;">
                <div style="display: flex; justify-content: space-between; color: #64748b; font-size: 13px;">
                    <span>الدوري الإنجليزي</span>
                    <span>27-09-2026</span>
                </div>
                <div style="display: flex; justify-content: space-around; align-items: center; margin-top: 10px; font-weight: bold;">
                    <span>ليفربول</span>
                    <span style="background: #e2e8f0; padding: 4px 10px; border-radius: 4px;">18:00</span>
                    <span>تشيلسي</span>
                </div>
            </div>

            <div class="card" style="padding: 15px;">
                <div style="display: flex; justify-content: space-between; color: #64748b; font-size: 13px;">
                    <span>الدوري الإنجليزي</span>
                    <span>28-09-2026</span>
                </div>
                <div style="display: flex; justify-content: space-around; align-items: center; margin-top: 10px; font-weight: bold;">
                    <span>أرسنال</span>
                    <span style="background: #e2e8f0; padding: 4px 10px; border-radius: 4px;">20:30</span>
                    <span>مانشستر يونايتد</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
